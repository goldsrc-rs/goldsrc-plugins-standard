[package]
name = "coreutils"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "POSIX core utilities suite (grep, cat, tail, head, wc, sha256sum) for GoldSrc server console"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[package.metadata.goldsrc]
role = "service"
bundle = "server"
priority = 10
permissions = [
    "engine:*",
    "storage:*",
    "cvar:*",
]

[package.metadata.goldsrc.sandbox]
memory_limit_mb = 16
table_elements = 5000
instances = 1

[dependencies]
goldsrc = { workspace = true }
goldsrc-api = { workspace = true }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
